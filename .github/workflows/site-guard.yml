# #4505: the site's own guard. The nav law runs before every deploy-bearing
# push: one primary nav, every canonical route present, zero page-local
# copies — plus the build itself.
name: site-guard
on: [push, pull_request]
jobs:
  nav-law-and-build:
    runs-on: ubuntu-latest
    # #4506: the first two runs died at 'Collecting page data' — the legacy
    # (app) template island's config validator reads six env vars at MODULE
    # LOAD, and CI has none (Netlify and dev have real ones). These are
    # BUILD-ONLY dummies: CI never serves a request, and no real secret may
    # ever live here. The nav law itself had passed; the guard's own env was
    # the bug (reading (a) of the finding).
    env:
      NEXT_PUBLIC_PROJECT_ID: ci-build-dummy
      NEXT_PUBLIC_PROJECT_NAME: ci-build-dummy
      NEXT_PUBLIC_SUPABASE_URL: https://ci-build-dummy.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-dummy-anon
      STRIPE_SECRET_KEY: ci-build-dummy-never-a-real-key
      RESEND_API_KEY: ci-build-dummy-never-a-real-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: THE NAV LAW — one header, mounted once, no page-local forks (#4505)
        run: node scripts/check-nav.mjs
      - name: THE AUTH FLOW LAW — every browser client is PKCE, no token in a URL (#4603)
        run: node scripts/check-auth-flow.mjs
      - run: npm run build
        env:
          # the crawl asserts the public site's redirects, so the build must
          # carry the public-site config the way the real deploy does
          ZO_PUBLIC_SITE: 'true'
      - name: THE ROUTE CRAWL — every nav route, the plural redirect, the branded 404 (#309 A4)
        run: node scripts/site-crawl.mjs
        env:
          ZO_PUBLIC_SITE: 'true'
